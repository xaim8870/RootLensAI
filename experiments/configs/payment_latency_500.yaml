schema_version: 1
experiment_id: payment_latency_500
fault_service: payment
fault_type: latency
fault_magnitude: 500ms

conditions:
  fault: payment_latency_500ms
  recovery: recovery_after_payment_latency_500ms

intervention:
  environment_variable: PAYMENT_DELAY_MS
  fault_value: "500"
  recovery_value: "0"
  verification:
    method: node_env
    executable: /nodejs/bin/node

collection:
  duration_seconds: 300
  sampling_interval_seconds: 5
  warmup_seconds: 30
  promql_window: 30s

repetitions: 1

expected_services:
  - frontend
  - frontend-proxy
  - checkout
  - payment
  - cart
  - currency
  - shipping
  - product-catalog
  - recommendation
  - email
  - ad
  - quote

validation:
  minimum_window_fraction: 1.0
  maximum_missing_request_rate_fraction: 0.05
  maximum_missing_cpu_fraction: 0.05
  maximum_missing_memory_fraction: 0.05
  minimum_target_active_fraction: 0.8
  minimum_fault_target_latency_ms: 400
  minimum_latency_increase_ms: 300
  maximum_recovery_to_fault_latency_ratio: 0.5
  maximum_error_rate: 1.0

infrastructure:
  prometheus_url: http://localhost:9090
  prometheus_max_sample_age_seconds: 60
  compose_project_directory: opentelemetry-demo
  compose_files:
    - compose.yaml
    - compose.observability.yaml
  env_files:
    - .env
    - .env.override
